<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nvTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262153"/>
      <stop offset="1" stop-color="#15122b"/>
    </linearGradient>
    <linearGradient id="nvMark" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="nvGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#nvTile)"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <!-- N monogram with upward launch arrowhead -->
  <g filter="url(#nvGlow)">
    <path d="M160 366 L160 158 L352 366 L352 158"
          fill="none" stroke="url(#nvMark)" stroke-width="54"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- launch arrowhead rising from the right stem -->
    <path d="M300 180 L352 116 L404 180 Z" fill="url(#nvMark)"/>
  </g>
</svg>
